name: CI

on:
  push:
    branches: [main, feature]
  pull_request:

# Windows: the desktop app and its tests (export_job) target Windows
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint
      - run: npx vitest run
      # The Rust build embeds the built frontend (frontendDist: ../dist)
      - run: npm run build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --lib
        working-directory: src-tauri
