[package]
name = "app"
version = "0.2.3"
description = "Mivid video editor"
authors = ["Yusuf"]
license = "Apache-2.0"
repository = "https://github.com/Yusufygc/Mivid"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
rfd = "0.15"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
